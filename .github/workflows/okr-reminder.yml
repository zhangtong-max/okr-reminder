name: OKR Reminder

on:
  schedule:
    # 每10分钟轮询一次（作为主要触发机制）
    - cron: "*/10 * * * 1-5"
    # 精准时间冗余触发（确保关键节点不遗漏）
    - cron: "25 0 * * 5"        # 周五 8:25 提前检查
    - cron: "30 0 * * 5"        # 周五 8:30 例会
    - cron: "0 1 * * 1-5"       # 9:00
    - cron: "0 6 * * 1-5"       # 14:00
    - cron: "0 9 * * 1-5"       # 17:00
  workflow_dispatch:
    inputs:
      slot:
        description: "时段 (auto/meeting/9/14/17)"
        required: true
        default: "auto"

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine slot
        id: slot
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            echo "slot=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install kdocs-cli
        run: |
          set -ex
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://wpsai.wpscdn.cn/skillhub/pro/v2.5.7/releases/kdocs-cli-2.5.7-linux-amd64.tar.gz" -o /tmp/kdocs-cli.tar.gz
          cd /tmp && tar xzf kdocs-cli.tar.gz
          cp /tmp/kdocs-cli "$HOME/.local/bin/kdocs-cli"
          chmod +x "$HOME/.local/bin/kdocs-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/kdocs-cli" version

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run OKR reminder
        env:
          KINGSOFT_DOCS_TOKEN: ${{ secrets.KINGSOFT_DOCS_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python check-okr.py ${{ steps.slot.outputs.slot }}

      - name: Persist state
        if: success()
        run: |
          if [ -f last-sent.json ] && git diff --quiet last-sent.json; then
            echo "状态文件无变化，跳过"
          elif [ -f last-sent.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last-sent.json
            git commit -m "chore: update last-sent state"
            git pull --rebase origin main
            git push
            echo "状态文件已保存"
          fi
