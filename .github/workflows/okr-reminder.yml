name: OKR Reminder

on:
  schedule:
    # 北京时间 9:00 = UTC 1:00，工作日（周一到周五）
    - cron: "0 1 * * 1-5"
    # 北京时间 14:00 = UTC 6:00，工作日
    - cron: "0 6 * * 1-5"
    # 北京时间 17:00 = UTC 9:00，工作日
    - cron: "0 9 * * 1-5"
    # 北京时间周五 8:30 = UTC 周五 0:30
    - cron: "30 0 * * 5"
  workflow_dispatch:
    inputs:
      slot:
        description: "时段 (9/14/17/meeting)"
        required: true
        default: "9"

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine slot from trigger time
        id: slot
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          DOW=$(date -u +%u)  # 1=周一, 5=周五
          if [[ "$DOW" == "5" && "$HOUR" == "00" && "$MIN" == "30" ]]; then
            echo "slot=meeting" >> "$GITHUB_OUTPUT"
          elif [[ "$HOUR" == "01" ]]; then
            echo "slot=9" >> "$GITHUB_OUTPUT"
          elif [[ "$HOUR" == "06" ]]; then
            echo "slot=14" >> "$GITHUB_OUTPUT"
          elif [[ "$HOUR" == "09" ]]; then
            echo "slot=17" >> "$GITHUB_OUTPUT"
          else
            echo "slot=${{ github.event.inputs.slot || '9' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install kdocs-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://wpsai.wpscdn.cn/skillhub/pro/v2.5.7/releases/kdocs-cli-2.5.7-linux-amd64.tar.gz" -o /tmp/kdocs-cli.tar.gz
          tar xzf /tmp/kdocs-cli.tar.gz -C /tmp
          find /tmp -name kdocs-cli -exec cp {} "$HOME/.local/bin/" \;
          chmod +x "$HOME/.local/bin/kdocs-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify kdocs-cli
        run: kdocs-cli version

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run OKR reminder
        env:
          KINGSOFT_DOCS_TOKEN: ${{ secrets.KINGSOFT_DOCS_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python check-okr.py ${{ steps.slot.outputs.slot }}
