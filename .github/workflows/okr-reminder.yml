name: OKR Reminder

on:
  schedule:
    # ===== 精确触发（北京时间，UTC+8）=====
    - cron: "0 1 * * 1-5"       # 北京时间 周一至周五 9:00
    - cron: "0 6 * * 1-5"       # 北京时间 周一至周五 14:00
    - cron: "0 9 * * 1-5"       # 北京时间 周一至周五 17:00
    - cron: "30 0 * * 5"        # 北京时间 周五 8:30 例会提醒
    # ===== 兜底轮询（每30分钟，自动判断是否需要补发）=====
    - cron: "*/30 0-16 * * 1-5" # 北京时间 8:00-次日0:00 每30分钟检查
  workflow_dispatch:
    inputs:
      slot:
        description: "时段 (9/14/17/meeting/auto)"
        required: true
        default: "auto"

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine slot
        id: slot
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 1 * * 1-5" ]]; then
            echo "slot=9" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 6 * * 1-5" ]]; then
            echo "slot=14" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 9 * * 1-5" ]]; then
            echo "slot=17" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "30 0 * * 5" ]]; then
            echo "slot=meeting" >> "$GITHUB_OUTPUT"
          else
            echo "slot=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install kdocs-cli
        run: |
          set -ex
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://wpsai.wpscdn.cn/skillhub/pro/v2.5.7/releases/kdocs-cli-2.5.7-linux-amd64.tar.gz" -o /tmp/kdocs-cli.tar.gz
          cd /tmp && tar xzf kdocs-cli.tar.gz
          cp /tmp/kdocs-cli "$HOME/.local/bin/kdocs-cli"
          chmod +x "$HOME/.local/bin/kdocs-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/kdocs-cli" version

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run OKR reminder
        env:
          KINGSOFT_DOCS_TOKEN: ${{ secrets.KINGSOFT_DOCS_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python check-okr.py ${{ steps.slot.outputs.slot }}

      - name: Persist state
        if: success()
        run: |
          if [ -f last-sent.json ] && git diff --quiet last-sent.json; then
            echo "状态文件无变化，跳过"
          elif [ -f last-sent.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last-sent.json
            git commit -m "chore: update last-sent state"
            git push
            echo "状态文件已保存"
          fi
