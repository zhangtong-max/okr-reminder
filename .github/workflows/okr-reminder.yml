name: OKR Reminder

on:
  schedule:
    # 每10分钟轮询一次（作为主要触发机制）
    - cron: "*/10 * * * 1-5"
    # 精准时间冗余触发（确保关键节点不遗漏）
    - cron: "25 0 * * 5"        # 周五 8:25 提前检查
    - cron: "30 0 * * 5"        # 周五 8:30 例会
    - cron: "0 1 * * 1-5"       # 9:00
    - cron: "0 6 * * 1-5"       # 14:00
    - cron: "0 9 * * 1-5"       # 17:00 (UTC+8)
  workflow_dispatch:
    inputs:
      slot:
        description: "时段 (auto/meeting/9/14/17/debug)"
        required: true
        default: "auto"

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine slot
        id: slot
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            echo "slot=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache kdocs-cli
        id: cache-kdocs
        uses: actions/cache@v4
        with:
          path: ~/.cache/kdocs-cli/kdocs-cli
          key: kdocs-cli-2.6.0-linux-amd64
          restore-keys: |
            kdocs-cli-2.6.0-

      - name: Install kdocs-cli
        run: |
          set -ex
          mkdir -p "$HOME/.local/bin"
          CACHE_FILE="$HOME/.cache/kdocs-cli/kdocs-cli"

          if [ -f "$CACHE_FILE" ]; then
            echo "使用缓存的 kdocs-cli"
            cp "$CACHE_FILE" "$HOME/.local/bin/kdocs-cli"
          else
            echo "下载 kdocs-cli..."
            mkdir -p "$HOME/.cache/kdocs-cli"

            # 优先从 GitHub Release 下载（GitHub Actions 内网更稳定）
            if curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 90 \
              "https://github.com/zhangtong-max/okr-reminder/releases/download/kdocs-cli-2.6.0/kdocs-cli-2.6.0-linux-amd64.tar.gz" \
              -o /tmp/kdocs-cli.tar.gz; then
              echo "从 GitHub Release 下载成功"
            else
              echo "GitHub Release 失败，回退到 WPS CDN..."
              curl -fsSL --retry 5 --retry-delay 10 --connect-timeout 15 --max-time 120 \
                "https://wpsai.wpscdn.cn/skillhub/pro/v2.6.0/releases/kdocs-cli-2.6.0-linux-amd64.tar.gz" \
                -o /tmp/kdocs-cli.tar.gz
            fi

            cd /tmp && tar xzf kdocs-cli.tar.gz
            cp /tmp/kdocs-cli "$CACHE_FILE"
            cp "$CACHE_FILE" "$HOME/.local/bin/kdocs-cli"
          fi

          chmod +x "$HOME/.local/bin/kdocs-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/kdocs-cli" version

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run OKR reminder
        env:
          KINGSOFT_DOCS_TOKEN: ${{ secrets.KINGSOFT_DOCS_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python check-okr.py ${{ steps.slot.outputs.slot }}

      - name: Persist state
        if: success()
        run: |
          if [ -f last-sent.json ] && git diff --quiet last-sent.json; then
            echo "状态文件无变化，跳过"
          elif [ -f last-sent.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last-sent.json
            git commit -m "chore: update last-sent state"
            git pull --rebase origin main
            git push
            echo "状态文件已保存"
          fi
